spring:
  application:
    name: u2go

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

resend:
  api-key: ${RESEND_API_KEY}
  from: "PutForm <support@putform.online>"